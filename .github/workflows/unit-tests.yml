name: Unit Tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: unit-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Run unit tests
    runs-on: macos-26
    timeout-minutes: 45
    env:
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve commit author
        id: author
        run: |
          SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          if ! git cat-file -e "${SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$SHA"
          fi
          EMAIL="$(git log -1 --format='%ae' "$SHA")"
          NAME="$(git log -1 --format='%an' "$SHA")"
          {
            echo "sha=$SHA"
            echo "email=$EMAIL"
            echo "name=$NAME"
          } >> "$GITHUB_OUTPUT"
          echo "Commit author: $NAME <$EMAIL>"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Run unit tests
        id: tests
        run: |
          chmod +x scripts/run-unit-tests.sh
          scripts/run-unit-tests.sh

      - name: Prepare failure email
        if: failure() && steps.tests.outcome == 'failure'
        env:
          AUTHOR_NAME: ${{ steps.author.outputs.name }}
          COMMIT_SHA: ${{ steps.author.outputs.sha }}
        run: |
          FAILED_TESTS_FILE="failed-tests.txt"
          if [[ ! -s "$FAILED_TESTS_FILE" ]]; then
            echo "The test run failed before individual test results were produced." > "$FAILED_TESTS_FILE"
          fi

          python3 scripts/compose-failure-email.py \
            --failed-tests "$FAILED_TESTS_FILE" \
            --author-name "$AUTHOR_NAME" \
            --repository "${{ github.repository }}" \
            --branch "${{ github.ref_name }}" \
            --commit "$COMMIT_SHA" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --commit-url "${{ github.server_url }}/${{ github.repository }}/commit/${COMMIT_SHA}" \
            --html-out email-body.html \
            --text-out email-body.txt

      - name: Decide whether to email
        if: failure() && steps.tests.outcome == 'failure'
        id: mail
        env:
          AUTHOR_EMAIL: ${{ steps.author.outputs.email }}
        run: |
          if [[ -z "$MAIL_USERNAME" || -z "$MAIL_PASSWORD" ]]; then
            echo "should_send=false" >> "$GITHUB_OUTPUT"
            echo "Skipping failure email: set repository secrets MAIL_USERNAME and MAIL_PASSWORD."
          elif [[ -z "$AUTHOR_EMAIL" || "$AUTHOR_EMAIL" == *"noreply.github.com"* ]]; then
            echo "should_send=false" >> "$GITHUB_OUTPUT"
            echo "Skipping failure email: commit author <$AUTHOR_EMAIL> is not a real inbox."
            echo "Use a real git author email, not a GitHub noreply address."
          else
            echo "should_send=true" >> "$GITHUB_OUTPUT"
            echo "Will email failed tests to $AUTHOR_EMAIL"
          fi

      - name: Email failed tests to the commit author
        if: failure() && steps.tests.outcome == 'failure' && steps.mail.outputs.should_send == 'true'
        uses: dawidd6/action-send-mail@v24
        with:
          server_address: ${{ vars.MAIL_HOST || 'smtp.gmail.com' }}
          server_port: ${{ vars.MAIL_PORT || 465 }}
          secure: true
          username: ${{ env.MAIL_USERNAME }}
          password: ${{ env.MAIL_PASSWORD }}
          subject: "Unit tests failed in ${{ github.repository }}"
          to: ${{ steps.author.outputs.email }}
          from: ${{ vars.MAIL_FROM || env.MAIL_USERNAME }}
          body: file://email-body.txt
          html_body: file://email-body.html
